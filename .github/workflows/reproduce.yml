name: Reproduce published artifacts
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: sha256sum --check checksums.sha256
      - run: python scripts/validate_reproduction.py
      - run: python scripts/validate_llm8b.py
